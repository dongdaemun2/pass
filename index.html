    <style>
        :root { --bg-color: #f4f7f6; --primary-color: #2c3e50; --btn-color: #3498db; --print-btn-color: #27ae60; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; }
        
        /* 헤더 스타일 */
        .header { background: var(--primary-color); color: white; padding: 15px; text-align: center; position: relative; }
        .header-buttons { position: absolute; right: 15px; top: 15px; display: flex; gap: 8px; }
        .refresh-btn, .patch-btn { background: none; border: 1px solid white; color: white; cursor: pointer; border-radius: 4px; padding: 5px 10px; }
        .patch-popup {
            display: none;
            position: fixed;
            top: 60px;
            right: 15px;
            width: 320px;
            max-height: 400px;
            overflow-y: auto;
            background: white;
            color: #222;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            z-index: 999;
            padding: 15px;
            text-align: left;
            box-sizing: border-box;
        }
        .patch-popup h3 { margin-top: 0; margin-bottom: 10px; color: var(--primary-color); }
        .patch-item { border-bottom: 1px solid #ddd; padding: 8px 0; font-size: 14px; line-height: 1.5; }
        .patch-item:last-child { border-bottom: none; }
        .patch-close { float: right; border: none; background: #eee; border-radius: 4px; cursor: pointer; padding: 3px 7px; }
        @media (max-width: 520px) {
            .header { padding-top: 55px; }
            .header-buttons { left: 15px; right: 15px; justify-content: center; }
            .patch-popup { left: 15px; right: 15px; width: auto; }
        }
        
        .container { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        
        /* 버튼 및 카드 스타일 */
        .item-btn { width: 100%; max-width: 400px; padding: 20px; font-size: 18px; border: none; border-radius: 8px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; text-align: left; transition: 0.2s; }
        .item-btn:active { background: #e0e0e0; }
        
        .detail-card { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; box-sizing: border-box; }
        .info-row { margin: 15px 0; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; text-align: left; }
        .label { font-size: 14px; color: #888; display: block; margin-bottom: 5px; }
        
        /* 내비게이션 및 인쇄 버튼 */
        .nav-bar { margin-top: 20px; display: flex; gap: 10px; width: 100%; max-width: 400px; }
        .nav-btn { flex: 1; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .back-btn { background: #95a5a6; color: white; }
        .home-btn { background: var(--btn-color); color: white; }
        .print-btn { width: 100%; max-width: 400px; margin-top: 10px; padding: 15px; background: var(--print-btn-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }

        /* [인쇄 전용 스타일] 인쇄 시 버튼들 숨김 */
        @media print {
            .header, .refresh-btn, .patch-btn, .patch-popup, .nav-bar, .print-btn { display: none !important; }
            body { background: white; }
            .container { padding: 0; }
            .detail-card { border: 1px solid #ccc; box-shadow: none; max-width: 100%; width: 100%; }
        }
    </style>
</head>

    function addPatchNote() {
        const text = prompt("추가할 패치 내용을 입력하세요");
        if (!text) return;

        const today = new Date();
        const date = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;

        patchNotes.unshift({ date, text });
        savePatchNotes();
        renderPatchNotes();

    }

        );

        if (mode === "1") addPatchNote();
        else if (mode === "2") editPatchNote();
        else if (mode === "3") deletePatchNote();
    }

    function getPatchNoteListText() {
        if (patchNotes.length === 0) return "등록된 패치내역이 없습니다.";

        return patchNotes.map((note, index) => {
            return `${index + 1}. [${note.date}] ${note.text}`;
        }).join("\n");
    }

    function editPatchNote() {
        if (patchNotes.length === 0) {
            alert("수정할 패치내역이 없습니다.");
            return;
        }

        const selected = prompt("수정할 패치내역 번호를 입력하세요\n\n" + getPatchNoteListText());
        const index = Number(selected) - 1;

        if (isNaN(index) || index < 0 || index >= patchNotes.length) {
            alert("잘못된 번호입니다.");
            return;
        }

        const newDate = prompt("날짜 수정", patchNotes[index].date);
        if (!newDate) return;

        const newText = prompt("내용 수정", patchNotes[index].text);
        if (!newText) return;

        patchNotes[index] = { date: newDate, text: newText };
        savePatchNotes();
        renderPatchNotes();

        alert("패치내역 수정 완료");
    }

    function deletePatchNote() {
        if (patchNotes.length === 0) {

        }

        savePatchNotes();
        renderPatchNotes();

    }
